events {}
http {
  # An `upstream {}` block resolves every listed hostname ONCE, at nginx startup,
  # via the OS resolver — and refuses to start at all if one is missing ("host not
  # found in upstream"). That's incompatible with this lab's starting state, where
  # limiter2's container doesn't exist yet: Docker's embedded DNS only answers for
  # currently-running containers, so nginx would never boot.
  #
  # Instead, resolve per-request via a variable + the Docker embedded resolver
  # (127.0.0.11), split roughly half the requests to each replica, and fall back
  # to limiter1 if the pick fails to resolve/connect (limiter2 down or absent).
  # Net effect matches the original design: while limiter2 is down, nginx routes
  # everything to limiter1; once limiter2 starts, each replica sees roughly half.
  resolver 127.0.0.11 valid=5s ipv6=off;

  split_clients "${request_id}" $picked_limiter {
    50%     limiter1:9000;
    *       limiter2:9000;
  }

  server {
    listen 8080;
    # The limiters' admin API (live config/reset) is for the dashboard on the
    # internal network only — never expose it through the public gateway.
    location /admin {
      return 404;
    }
    location / {
      set $limiter_upstream http://$picked_limiter;
      proxy_pass $limiter_upstream;
      proxy_connect_timeout 2s;
      proxy_set_header X-Client $http_x_client;
      error_page 502 504 = @fallback;
    }
    location @fallback {
      # Must also resolve dynamically (not a static proxy_pass) — a literal
      # hostname here would be cached at nginx startup for the worker's lifetime,
      # going stale (and silently misrouting to whatever container later reuses
      # that IP) the moment limiter1 gets recreated, e.g. by the REDIS_ENABLED flip.
      set $fallback_upstream http://limiter1:9000;
      proxy_pass $fallback_upstream;
      proxy_set_header X-Client $http_x_client;
    }
  }
}
