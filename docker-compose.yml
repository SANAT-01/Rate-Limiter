services:
  lb:
    image: nginx:alpine
    container_name: lb
    restart: unless-stopped
    depends_on:
      - limiter1
    # No public route — internal only, reached via the frontend/dashboard
    volumes:
      - ./backend/lb/nginx.conf:/etc/nginx/nginx.conf:ro
    networks: [ratelimit]

  # Two explicit limiter replicas so nginx round-robins deterministically.
  # The lab starts with ONLY limiter1 up — starting limiter2 is the fail moment.
  limiter1:
    build: ./backend/limiter
    container_name: limiter1
    restart: unless-stopped
    environment:
      LIMITER_NAME: limiter1
      ALGORITHM: "fixed-window"
      RATE_LIMIT: "10"
      WINDOW_SECONDS: "60"
      REDIS_ENABLED: "true"
      FAIL_MODE: "open"
      REDISHOST: redis
      APIHOST: api
    depends_on:
      - api
    networks: [ratelimit, backend-net]

  limiter2:
    build: ./backend/limiter
    container_name: limiter2
    restart: unless-stopped
    environment:
      LIMITER_NAME: limiter2
      ALGORITHM: "fixed-window"
      RATE_LIMIT: "10"
      WINDOW_SECONDS: "60"
      REDIS_ENABLED: "true"
      FAIL_MODE: "open"
      REDISHOST: redis
      APIHOST: api
    depends_on:
      - api
    networks: [ratelimit, backend-net]

  api:
    build: ./backend/api
    container_name: api

    restart: unless-stopped
    networks: [ratelimit]

  # PUBLIC — this is the resume-facing part.
  # SECURITY NOTE: this container holds the Docker socket, which is
  # root-equivalent access to the whole VPS, not just this project's
  # containers. Exposing it publicly means its login/auth is the only
  # thing standing between the internet and full host control.
  # Before relying on this in production, remove the socket mount and
  # have the dashboard call a small internal API instead (see below).
  frontend:
    build: ./frontend
    container_name: frontend
    restart: unless-stopped
    user: root
    environment:
      LB_URL: http://lb:8080
      # Node's fetch()/undici has known DNS resolution hangs under Alpine (musl)
      # in Docker; this makes dns.lookup() try IPv4 first instead of racing/
      # stalling on IPv6, which these internal networks don't use anyway.
      NODE_OPTIONS: "--dns-result-order=ipv4first"
      # dns.lookup() (used by http.request) runs on libuv's threadpool, 4 threads
      # by default for the WHOLE process. A stopped limiter's DNS/connect attempt
      # can hang for the admin-check timeout instead of failing fast, and with
      # only 4 threads a couple of those in flight (e.g. from the dashboard's own
      # 3s polling) can starve unrelated lookups elsewhere in the app. More
      # headroom here; lib/limiters.ts also skips the network call entirely for
      # containers Docker already reports as not running.
      UV_THREADPOOL_SIZE: "16"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - lb
    networks: [ratelimit]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ratelimit-fe.rule=Host(`ratelimit.sanattudu.tech`)"
      - "traefik.http.routers.ratelimit-fe.entrypoints=websecure"
      - "traefik.http.routers.ratelimit-fe.tls=true"
      - "traefik.http.routers.ratelimit-fe.tls.certresolver=letsencrypt"
      - "traefik.http.services.ratelimit-fe.loadbalancer.server.port=3000"

networks:
  ratelimit:
  backend-net:
    external: true